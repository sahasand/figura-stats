[pytest]
pythonpath = .

# --continue-on-collection-errors is a defensive hedge for future module
# additions. When a module is being written and has an import error, it can
# halt the entire session if --continue-on-collection-errors is not set;
# this flag ensures that all test modules still attempt collection even if one
# fails. As of 2026-07-26, all modules including test_summary.py are complete
# and run cleanly inside `make test` — there is no pending work and every suite
# exits 0. The flag remains as a defensive measure for development.
addopts = --continue-on-collection-errors
