[pytest]
pythonpath = .

# --continue-on-collection-errors is load-bearing while Path B for Table 1 is
# pending. tests/test_summary.py imports validate.summary, which does not exist
# yet (it is the clean-room half of Task 11, written from
# stats-validation/spec/summary-table1.md alone), so it fails at COLLECTION —
# and pytest's default on a collection error is to abort the whole session,
# which would silently stop test_cox/test_km/test_logistic/test_groupcompare/
# test_io from running at all. The suite must still be red (that is the point
# of a written-first acceptance test), but it must be red for exactly one
# reason and still report the other five modules.
#
# The Makefile's `test` target now --ignores that module in its gated run and
# runs it separately (see KNOWN_PENDING there), so this flag no longer carries
# `make test`. It still carries a bare `pytest tests` — which is what the README
# tells a human to run, and what anyone debugging runs by reflex — so it stays.
addopts = --continue-on-collection-errors
